server.port=8080

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/}
spring.data.mongodb.database=${MONGODB_DATABASE:ai_query_dashboard}

ai.provider=${AI_PROVIDER:anthropic}
ai.base-url=${AI_BASE_URL:}
ai.endpoint-path=${AI_ENDPOINT_PATH:}
ai.api-key=${AI_API_KEY:}
ai.anthropic-version=${ANTHROPIC_VERSION:2023-06-01}
ai.model=${AI_MODEL:claude-sonnet-5}
ai.reasoning-effort=${AI_REASONING_EFFORT:medium}

ai.collection=${AI_COLLECTION:payments}
ai.saved-cards-collection=${AI_SAVED_CARDS_COLLECTION:saved_cards}
